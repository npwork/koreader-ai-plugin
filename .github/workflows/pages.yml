name: pages

# Publishes the KPM repository to GitHub Pages, then proves it works by
# installing from the live URL with the real package manager.
#
# The repository must be public for Pages to be available on a free plan.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Ref to publish (default: whatever triggered the run)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The stable channel is built from the newest v* tag.
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Build the site
        # The gateway address is not in the repository; it is baked into the
        # package here. Without the secret the package ships with no endpoint
        # and the reader is asked to set one on the device.
        env:
          AIDICT_ENDPOINT: ${{ secrets.AIDICT_ENDPOINT }}
        run: ./scripts/build-site.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: install from the live repository
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install what KPM needs to build, Lua to check what it installs, and a display for KOReader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libcurl4-openssl-dev libsqlite3-dev libcjson-dev libarchive-dev libssl-dev \
            lua5.1 xvfb libsdl2-2.0-0 fonts-dejavu-core

      - name: Build KPM from source
        run: ./scripts/kpm-host-build.sh

      - name: Install the plugin from the published repository
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          set -x
          BASE="${PAGE_URL%/}"
          MANIFEST="${BASE}/stable/manifest.json"

          # Pages can take a moment to serve a fresh deployment.
          for _ in $(seq 1 30); do
            curl -fsS "${MANIFEST}" -o /tmp/manifest.json && break
            sleep 5
          done
          test -s /tmp/manifest.json || { echo "::error::${MANIFEST} never became available"; exit 1; }

          SANDBOX="${GITHUB_WORKSPACE}/.kpm/sandbox"
          mkdir -p "${SANDBOX}/packages" "${SANDBOX}/koreader/plugins"
          export KOREADER_DIR="${SANDBOX}/koreader"
          KPM="${GITHUB_WORKSPACE}/.kpm/build/cli/kpm"

          "${KPM}" -y add-repo "${MANIFEST}"
          "${KPM}" -y install koreader-aidict

          PLUGIN="${SANDBOX}/koreader/plugins/aidict.koplugin"
          test -f "${PLUGIN}/main.lua"
          test -f "${PLUGIN}/aidict/lookup.lua"

          # What landed must be the version the channel advertises.
          EXPECTED="$(curl -fsS "${BASE}/stable/version.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"]["koreader-aidict"]["version_string"])')"
          grep -q "\"${EXPECTED}\"" "${PLUGIN}/aidict/version.lua" \
            || { echo "::error::installed version does not match the channel's ${EXPECTED}"; exit 1; }

          # What was published has to be loadable Lua. The endpoint is
          # injected into source at build time, so this is where a bad secret
          # would otherwise slip through to the device.
          find "${PLUGIN}" -name '*.lua' -exec luac5.1 -p {} +

          # The short URL at the site root is the same repository with absolute
          # artifact URLs, for typing on a Kindle keyboard. It has to install too.
          "${KPM}" -y uninstall koreader-aidict
          "${KPM}" -y remove-repo npwork
          "${KPM}" -y add-repo "${BASE}/kpm.json"
          "${KPM}" -y install koreader-aidict
          test -f "${PLUGIN}/main.lua"

          echo "PLUGIN=${PLUGIN}" >> "${GITHUB_ENV}"
          echo "installed koreader-aidict ${EXPECTED} from ${BASE}, and it parses"

      - name: Load what was installed into a real KOReader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          TAG="$(gh release list --repo koreader/koreader --limit 1 --json tagName --jq '.[0].tagName')"
          gh release download "${TAG}" --repo koreader/koreader --pattern '*x86_64*.AppImage' --dir .
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null

          KOREADER_DIR="$(dirname "$(find squashfs-root -name reader.lua | head -1)")"
          mkdir -p "${KOREADER_DIR}/plugins"
          # The plugin as KPM installed it, not as it sits in the repository.
          cp -r "${PLUGIN}" "${KOREADER_DIR}/plugins/"

          mkdir -p books
          printf '%s' '<html><body><p>The quick brown fox jumps over the lazy dog.</p></body></html>' > books/sample.html

          set +e
          cd "${KOREADER_DIR}"
          timeout --signal=TERM --kill-after=15 45 \
            xvfb-run -a --server-args="-screen 0 600x800x24" \
            ./reader.lua -d "${GITHUB_WORKSPACE}/books/sample.html" \
            > "${GITHUB_WORKSPACE}/koreader.log" 2>&1 < /dev/null
          echo "reader exited with $?"
          set -e

          cd "${GITHUB_WORKSPACE}"
          # xvfb-run returns as soon as it has forwarded the signal, so give
          # KOReader the moment it needs to finish writing its teardown.
          for _ in $(seq 1 20); do
            grep -q "Tearing down UIManager" koreader.log && break
            sleep 1
          done

          tail -c 4000 koreader.log
          grep -q "Plugin loaded[[:space:]]*aidict" koreader.log \
            || { echo "::error::the published package does not load in KOReader"; exit 1; }
          if grep -qE "Error when loading.*aidict|aidict.*attempt to (call|index)" koreader.log; then
            echo "::error::the published package errored inside KOReader"
            exit 1
          fi
          grep -q "Tearing down UIManager with exit code: 0" koreader.log \
            || { echo "::error::KOReader did not shut down cleanly"; exit 1; }

          echo "the published package loads in KOReader"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koreader-log-published
          path: koreader.log
