name: koreader smoke

# Loads the plugin into a real KOReader and checks that KOReader accepts it.
#
# The specs stub KOReader's API; this is the only thing that proves the stubs
# still match it. It runs on a GitHub runner rather than in a cloud session
# because that is where a KOReader build can actually be downloaded — see
# docs/emulator.md.

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/koreader-smoke.yml"
  workflow_dispatch:
    inputs:
      koreader_tag:
        description: "KOReader release to test against (default: latest)"
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the runtime KOReader needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libsdl2-2.0-0 fonts-dejavu-core

      - name: Download a KOReader build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.koreader_tag }}
        run: |
          set -x
          if [ -z "${TAG}" ]; then
            TAG="$(gh release list --repo koreader/koreader --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          echo "Testing against KOReader ${TAG}"
          gh release download "${TAG}" --repo koreader/koreader --pattern '*x86_64*.AppImage' --dir .
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          find squashfs-root -name reader.lua

      - name: Install the plugin into it
        run: |
          KOREADER_DIR="$(dirname "$(find squashfs-root -name reader.lua | head -1)")"
          echo "KOREADER_DIR=${KOREADER_DIR}" >> "${GITHUB_ENV}"
          mkdir -p "${KOREADER_DIR}/plugins"
          cp -r plugin/aidict.koplugin "${KOREADER_DIR}/plugins/"
          ls "${KOREADER_DIR}/plugins"

      - name: Start KOReader with the plugin, headlessly
        run: |
          mkdir -p books
          # A minimal document to open, so KOReader starts the reader rather
          # than sitting in the file manager.
          printf '%s' '<html><body><p>The quick brown fox jumps over the lazy dog.</p></body></html>' > books/sample.html

          # KOReader treats the TERM as a close request and shuts down the way
          # it would on the device, which also runs the plugin's
          # onCloseDocument and onFlushSettings handlers.
          #
          # timeout goes *inside* xvfb-run, not around it. xvfb-run kills its
          # X server from an EXIT trap, so signalling xvfb-run pulls the
          # display out from under KOReader mid-teardown and it dies with
          # "XIO: fatal IO error" instead of shutting down — which is exactly
          # the thing this job is here to check. This way the signal reaches
          # reader.lua, and the display outlives it.
          # Do not sweep for orphans here either: killing what is left cuts
          # the teardown short. --kill-after is the backstop instead.
          set +e
          cd "${KOREADER_DIR}"
          xvfb-run -a --server-args="-screen 0 600x800x24" \
            timeout --signal=TERM --kill-after=15 45 \
            ./reader.lua -d "${GITHUB_WORKSPACE}/books/sample.html" \
            > "${GITHUB_WORKSPACE}/koreader.log" 2>&1 < /dev/null
          echo "reader exited with $?"
          set -e

      - name: The plugin must have loaded, and KOReader must have survived it
        run: |
          # xvfb-run only returns once reader.lua has exited, so the log is
          # complete by the time this step runs.
          tail -c 20000 koreader.log || true

          grep -q "Plugin loaded[[:space:]]*aidict" koreader.log \
            || { echo "::error::KOReader did not load the plugin"; exit 1; }

          if grep -qE "Error when loading.*aidict|aidict.*attempt to (call|index)" koreader.log; then
            echo "::error::the plugin raised an error inside KOReader"
            exit 1
          fi

          # A clean teardown means the plugin's close handlers ran without
          # taking KOReader down with them.
          grep -q "Tearing down UIManager with exit code: 0" koreader.log \
            || { echo "::error::KOReader did not shut down cleanly"; exit 1; }

          echo "KOReader loaded aidict and shut down cleanly"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koreader-log
          path: koreader.log
