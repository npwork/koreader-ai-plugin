name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and the test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install busted
          sudo luarocks install dkjson
          sudo luarocks install luacheck
          sudo luarocks install luasocket

      - name: Lint
        run: luacheck plugin spec scripts

      - name: Unit tests
        run: busted --output=TAP

      - name: Package install, upgrade and uninstall
        run: ./scripts/verify-package.sh

      - name: Build the package and the repository
        run: |
          python3 scripts/kpmrepo.py package
          python3 scripts/kpmrepo.py repo --channel stable

      - uses: actions/upload-artifact@v4
        with:
          name: kpm-repo
          path: dist/

  distribution:
    name: real kpm, real http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install what KPM needs to build here
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libcurl4-openssl-dev libsqlite3-dev libcjson-dev libarchive-dev libssl-dev

      - name: Build KPM from source
        run: ./scripts/kpm-host-build.sh

      - name: Install, upgrade and uninstall through KPM over HTTP
        run: ./scripts/test-distribution.sh

  release:
    needs: [test, distribution]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        run: python3 scripts/kpmrepo.py package

      - name: Publish it on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.kpkg --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/*.kpkg --clobber
