name: probe koreader source
on:
  push:
    branches: [claude/koreader-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list --repo koreader/koreader --limit 1 --json tagName --jq '.[0].tagName')"
          echo "TAG ${TAG}"
          gh release download "${TAG}" --repo koreader/koreader --pattern '*x86_64*.AppImage' --dir .
          chmod +x ./*.AppImage && ./*.AppImage --appimage-extract >/dev/null
          F="$(find squashfs-root -name dictquicklookup.lua | head -1)"
          R="$(find squashfs-root -name readerdictionary.lua | head -1)"
          echo "=== addQueryWordToResult"; awk '/^function DictQuickLookup:addQueryWordToResult/,/^end/' "$F"
          grep -n "addQueryWordToResult" "$F"
          echo "=== changeDictionary"; awk '/^function DictQuickLookup:changeDictionary/,/^end/' "$F"
          echo "=== lookupword/displayword"; grep -n "lookupword\|displayword" "$F" | head -60
          echo "=== showDict"; awk '/^function ReaderDictionary:showDict/,/^end/' "$R"
