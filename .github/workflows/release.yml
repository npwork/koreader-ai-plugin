name: release

# Cuts a release from the phone: bump the version, tag it, publish it.
#
# Actions -> release -> Run workflow -> pick patch / minor / major.
#
# The tag is what the stable channel follows, so this is what reaches the
# Kindle. Publishing runs as part of this workflow rather than being triggered
# by the tag, because a push made with GITHUB_TOKEN does not start other
# workflows.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the test tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install busted
          sudo luarocks install dkjson
          sudo luarocks install luacheck
          sudo luarocks install luasocket

      - name: Raise the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION="$(python3 - <<'PY'
          import os
          import re

          path = "plugin/aidict.koplugin/aidict/version.lua"
          text = open(path).read()
          major, minor, patch = (int(p) for p in re.search(
              r'string\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text).groups())

          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1

          version = f"{major}.{minor}.{patch}"
          text = re.sub(r'string\s*=\s*"[0-9.]+"', f'string = "{version}"', text, count=1)
          text = re.sub(r"major\s*=\s*\d+", f"major = {major}", text, count=1)
          text = re.sub(r"minor\s*=\s*\d+", f"minor = {minor}", text, count=1)
          text = re.sub(r"patch\s*=\s*\d+", f"patch = {patch}", text, count=1)
          open(path, "w").write(text)
          print(version)
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing v${VERSION}"

      - name: Check before tagging
        run: make check

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/aidict.koplugin/aidict/version.lua
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

  publish:
    needs: tag
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  done:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Say what to do on the device
        run: |
          {
            echo "### ${{ needs.tag.outputs.tag }} is live"
            echo
            echo "It installed from the published URL and loaded in a real KOReader."
            echo
            echo "On the Kindle:"
            echo
            echo '```'
            echo ";kpm update"
            echo ";kpm upgrade"
            echo '```'
            echo
            echo "Then restart KOReader."
          } >> "${GITHUB_STEP_SUMMARY}"
